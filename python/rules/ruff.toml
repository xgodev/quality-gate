# Canonical Quality Gate ruleset -- Python (ruff).
# Enforced by QG via ruff --config <this> --isolated.
# The target project's config (pyproject.toml [tool.ruff]) is IGNORED.
# Community defaults; fine calibration in V2.
line-length = 88
target-version = "py39"

# LAW (docs/contract.md): the fmt/lint/complexity metrics measure SOURCE CODE.
# QG's CANONICAL ignore (tamper-proof: NEVER the target project's
# .gitignore/pyproject). `extend-exclude` adds to ruff's defaults and does not
# depend on respect-gitignore -- even if the dev empties the .gitignore,
# generated/vendored dirs stay out. List aligned with nodejs/web .prettierignore.
extend-exclude = [
  "node_modules",
  "dist",
  "build",
  "out",
  ".next",
  ".nuxt",
  ".expo",
  "coverage",
  ".turbo",
  ".cache",
  ".venv",
  "venv",
  "*.min.js",
  "*.bundle.js",
  "*.chunk.js",
  "*.map",
]

[lint]
select = ["E", "F", "W", "I"]
