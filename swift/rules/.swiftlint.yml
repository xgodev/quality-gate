# Canonical Quality Gate ruleset -- Swift (SwiftLint).
# Enforced by QG via swiftlint --config <this>.
# The target project's config (.swiftlint.yml) is IGNORED.
# Adjusted community defaults; fine calibration in V2.

# Build artifacts are never project code.
excluded:
  - .build
  - Pods
  - .swiftpm

disabled_rules:
  - todo
  # Short idiomatic parameters (a, b, x, y) are common and not a defect.
  - identifier_name
  # swift-format (fmt) REQUIRES a trailing comma in multi-line literals; the
  # swiftlint default FORBIDS it. So they do not contradict each other, the
  # gate adopts the swift-format convention and disables trailing_comma in swiftlint.
  - trailing_comma

opt_in_rules:
  - empty_count
  - force_unwrapping

line_length: 120
