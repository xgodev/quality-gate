# Canonical Quality Gate ruleset -- Kotlin (detekt).
# Enforced by QG via detekt -c <this>. The target project's config is IGNORED.
# Community defaults; fine calibration in V2.
build:
  maxIssues: 0

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 7
  NestedBlockDepth:
    active: true
    threshold: 4
  ComplexCondition:
    active: true
    threshold: 4

style:
  active: true

potential-bugs:
  active: true
