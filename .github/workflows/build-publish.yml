name: build-publish

# Builds one MULTI-ARCH image per language and pushes to GHCR.
#
# Each (language, arch) pair builds on a NATIVE runner (no QEMU: emulated
# toolchains fail in subtle ways and a silently-broken arm64 image is worse
# than no arm64 image) and is pushed by digest. The `merge` job then stitches
# the per-arch digests into one manifest list per language, so
# `docker pull ghcr.io/xgodev/quality-gate/<lang>:v1` resolves to the caller's
# architecture -- amd64 CI runners and Apple-Silicon laptops alike.
#
# Tags: `latest` on the default branch; on a vX.Y.Z tag also the exact
# `:vX.Y.Z` and the moving major `:vX` that consumers pin.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Grow this list as each language's Dockerfile lands.
        lang: [rust, go, nodejs, web, python, java, kotlin, swift]
        platform: [amd64, arm64]
        exclude:
          # swift is amd64-only: realm ships no arm64 swiftlint binary, so an
          # arm64 image has to compile SwiftLint from source (~20+ min every
          # release). Not worth holding releases for the least-used image --
          # Apple Silicon runs the swift image emulated via
          # `docker run --platform linux/amd64`.
          - lang: swift
            platform: arm64
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # buildx driver -- the default docker driver cannot export the gha cache.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.lang }}"
          echo "name=${img,,}" >> "$GITHUB_OUTPUT"  # GHCR requires a lowercase path

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.lang }}.Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.lang }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.lang }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.lang }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go, nodejs, web, python, java, kotlin, swift]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.lang }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest list
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.lang }}"
          img="${img,,}"
          tags=(-t "${img}:latest")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME}"   # vX.Y.Z
            major="${ver%%.*}"         # vX -- the moving major tag consumers pin
            tags+=(-t "${img}:${ver}" -t "${img}:${major}")
          fi
          cd /tmp/digests
          docker buildx imagetools create "${tags[@]}" \
            $(printf "${img}@sha256:%s " *)

      - name: Show the published manifest
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.lang }}"
          docker buildx imagetools inspect "${img,,}:latest"
